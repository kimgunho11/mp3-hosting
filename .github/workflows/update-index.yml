name: Generate index.html for media files

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate index.html
        run: |
          echo "<!DOCTYPE html>" > index.html
          echo "<html lang='ko'><head><meta charset='UTF-8'><title>파일 목록</title></head><body>" >> index.html
          echo "<h1>📁 업로드된 미디어 파일 목록</h1><ul>" >> index.html

          for file in *; do
            if [[ "$file" =~ \.mp3$ ]]; then
              echo "<li>🎵 <a href='$file'>$file</a></li>" >> index.html
            elif [[ "$file" =~ \.gif$ ]]; then
              echo "<li>🖼️ <a href='$file'>$file</a><br><img src='$file' style='max-height:100px;'></li>" >> index.html
            elif [[ "$file" =~ \.png$ ]]; then
              echo "<li>🖼️ <a href='$file'>$file</a><br><img src='$file' style='max-height:100px;'></li>" >> index.html
            fi
          done

          echo "</ul></body></html>" >> index.html

      - name: Commit and push index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "자동 생성된 index.html" || echo "No changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
